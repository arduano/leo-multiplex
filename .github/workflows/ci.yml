name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-host-published:
    uses: ./.github/workflows/windows-published.yml
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned toolchain and public dependencies
        run: |
          npm install --global --ignore-scripts npm@11.17.0
          npm ci --strict-allow-scripts
      - run: npm run typecheck && npm test && npm run build
      - name: Verify WSL installer wrapper with disposable tool stubs
        run: node --test tests/installer-wrappers.mjs
      - name: Verify WSL installation bootstrap with disposable local Git sources
        run: node --test tests/installation-bootstraps.mjs
      - name: Build deployment container
        run: docker build --tag leo-multiplex:ci .
      - name: Exercise shipped assets and fail-closed authentication
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --mount type=bind,src="$PWD/scripts",dst=/app/scripts,readonly \
            leo-multiplex:ci node scripts/container-smoke.mjs
      - name: Exercise Compose DNS proxy, Unix socket and WebSocket authentication
        run: python3 scripts/cloudflare-proxy-smoke.py leo-multiplex:ci
  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify Windows PowerShell and PowerShell installer wrappers with disposable tool stubs
        # No package installation, native host, authentication or model calls.
        # The real helper's Windows release gate remains enforced separately.
        run: node --test tests/installer-wrappers.mjs
      - name: Verify Windows PowerShell and PowerShell installation bootstraps
        # Git fetches use only disposable local repositories; no host is started.
        run: node --test tests/installation-bootstraps.mjs
      - name: Verify work-command PowerShell exit codes and descendant cleanup
        # Exact shell helper only; no framework overlay or model/auth calls.
        run: node tests/windows-work-shell-smoke.mjs
